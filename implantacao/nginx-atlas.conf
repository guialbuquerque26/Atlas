# Proxy reverso do Atlas. A API escuta só em 127.0.0.1; quem fala com a rede
# é o nginx (TLS, timeouts e limite de corpo).

upstream atlas_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name atlas.suaempresa.com.br;

    ssl_certificate     /etc/ssl/certs/atlas.crt;
    ssl_certificate_key /etc/ssl/private/atlas.key;

    # Tem que casar com ATLAS_UPLOAD_MAX_MB, senão o nginx corta antes da API
    # e o usuário recebe um 413 sem a mensagem explicativa.
    client_max_body_size 50m;

    location / {
        proxy_pass http://atlas_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Geração em GPU é lenta: um vídeo pode levar minutos. Timeout curto
        # aqui derrubaria requisições que ainda estão progredindo.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        # Streaming token a token (/chat/stream) só funciona sem buffer.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Sondas do balanceador não precisam de TLS interno nem de log.
    location = /health { proxy_pass http://atlas_api; access_log off; }
    location = /ready  { proxy_pass http://atlas_api; access_log off; }
}

server {
    listen 80;
    server_name atlas.suaempresa.com.br;
    return 301 https://$host$request_uri;
}
